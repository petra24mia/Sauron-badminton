<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">About section photo placeholder</title>
  <desc id="desc">Stylized badminton court placeholder graphic prompting editors to replace it with a club photo.</desc>
  <rect width="1200" height="780" fill="#F5F2EA"/>
  <rect x="80" y="80" width="1040" height="620" rx="16" fill="#2C4A34"/>
  <rect x="140" y="140" width="920" height="500" fill="none" stroke="#F5F2EA" stroke-width="10"/>
  <line x1="600" y1="140" x2="600" y2="640" stroke="#F5F2EA" stroke-width="8"/>
  <line x1="140" y1="390" x2="1060" y2="390" stroke="#F5F2EA" stroke-width="8"/>
  <line x1="300" y1="140" x2="300" y2="640" stroke="#F5F2EA" stroke-width="6"/>
  <line x1="900" y1="140" x2="900" y2="640" stroke="#F5F2EA" stroke-width="6"/>
  <rect x="235" y="270" width="730" height="240" rx="18" fill="#16261C" fill-opacity=".72"/>
  <text x="600" y="345" text-anchor="middle" fill="#F5F2EA" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">Add your club photo here</text>
  <text x="600" y="415" text-anchor="middle" fill="#DCE7DD" font-family="Arial, Helvetica, sans-serif" font-size="30">Replace assets/about-placeholder.svg with assets/about.jpg</text>
</svg>
